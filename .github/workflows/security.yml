name: security
# Secret scan (gitleaks) and dependency audit, shared by every OpenVibers repo (Track Q).
# Kept apart from deploy.yml so a finding never blocks a Pages deploy.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  security:
    uses: OpenVibers/OpenVibe.Shared/.github/workflows/security.yml@15b927b7d9fe35fe64ee4b7f3b4792b46ebdbddb
    with:
      audit-fail-level: none   # report only until fixed: astro has a critical advisory whose fix is a semver-major (astro 7)
